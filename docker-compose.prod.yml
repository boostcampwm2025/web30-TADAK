services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env.production
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 백엔드 API (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - app-network

  # 채점 서버 (NestJS)
  judge:
    build:
      context: .
      dockerfile: apps/judge/Dockerfile
      target: production
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - JUDGE_VOLUME=/judge-data
      - JUDGE_HOST_PATH=/srv/judge-data
      - JUDGE_PROBLEMS_PATH=/judge-data
      - JUDGE_SUBMISSIONS_PATH=/judge-data/submissions
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/judge-data:/judge-data
    networks:
      - app-network

  # 채점 러너 이미지 빌드
  judge-runner:
    build:
      context: apps/judge/runner
      dockerfile: Dockerfile
    image: judge-javascript
    restart: "no"
    command: ["sh", "-c", "exit 0"]
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
